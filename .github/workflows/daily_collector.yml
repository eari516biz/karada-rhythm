name: Karada Rhythm Collector

on:
  schedule:
    # 毎日 日本時間 7:00, 12:00, 19:00 (UTC 22:00, 03:00, 10:00)
    - cron: '0 22,3,10 * * *'
  workflow_dispatch: # 手動実行トリガー

permissions:
  contents: write

jobs:
  collect-and-extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install youtube-transcript-api

      - name: Collect new video transcripts (safe rate)
        run: |
          python 04_scripts/collect_transcripts.py

      - name: Extract structured wisdom with Gemini (if API key present)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python 04_scripts/extract_wisdom.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 03_data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-collect: Daily tuning wisdom updates [skip ci]"
            git push
          fi
